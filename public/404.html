<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>일기</title>
    <script>
      // GitHub Pages SPA redirect trick
      // Stores the full path in sessionStorage then redirects to the base URL.
      // index.html reads it back and restores the history state.
      var base = '/diary_exchange/';
      var path = window.location.pathname.replace(base, '') + window.location.search + window.location.hash;
      sessionStorage.setItem('spa_redirect', base + path);
      window.location.replace(base);
    </script>
  </head>
  <body></body>
</html>
