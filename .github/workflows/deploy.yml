name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build
        env:
          VITE_SUPABASE_URL: https://pwsnbgwxxjtajpqcygaz.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3c25iZ3d4eGp0YWpwcWN5Z2F6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI4OTg2OTcsImV4cCI6MjA4ODQ3NDY5N30.SV2yw_gpXT7hWKA_a8glxlPA9F02f3_SHIROL7w0up4
          VITE_OPENAI_API_KEY: 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

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
